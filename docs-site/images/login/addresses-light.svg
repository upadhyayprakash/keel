<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 186" width="720" height="186" role="img" aria-label="Passkeys only work at the public address; codes work anywhere"><rect width="720" height="186" rx="14" fill="#F8FAFC"/><rect x="18" y="18" width="330" height="150" rx="10" fill="#EEF2F6" stroke="#067647" stroke-width="1.5"/><text x="36" y="46" font-family="'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#0F1A2A" text-anchor="start">The --public-url address</text><text x="36" y="68" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="400" fill="#4B5563" text-anchor="start">https://my-mac.tail1234.ts.net</text><circle cx="46" cy="98" r="9" fill="#067647"/><text x="46" y="102" font-family="'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#F8FAFC" text-anchor="middle">✓</text><text x="64" y="102" font-family="'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#0F1A2A" text-anchor="start">Passkeys work</text><circle cx="46" cy="126" r="9" fill="#067647"/><text x="46" y="130" font-family="'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#F8FAFC" text-anchor="middle">✓</text><text x="64" y="130" font-family="'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#0F1A2A" text-anchor="start">Codes work (when turned on)</text><text x="36" y="156" font-family="'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="#4B5563" text-anchor="start">A passkey belongs to this one name.</text><rect x="372" y="18" width="330" height="150" rx="10" fill="#EEF2F6" stroke="#DDE2E8" stroke-width="1.5"/><text x="390" y="46" font-family="'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" fon