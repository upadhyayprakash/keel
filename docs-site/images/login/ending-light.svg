<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 294" width="720" height="294" role="img" aria-label="What each command ends"><rect width="720" height="294" rx="14" fill="#F8FAFC"/><text x="368" y="34" font-family="'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#4B5563" text-anchor="middle">Passkey sessions</text><text x="504" y="34" font-family="'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#4B5563" text-anchor="middle">Code sessions</text><text x="640" y="34" font-family="'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#4B5563" text-anchor="middle">Stops future sign-ins</text><rect x="14" y="50" width="692" height="38" rx="8" fill="#EEF2F6" stroke="#DDE2E8" stroke-width="1"/><text x="28" y="74" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="400" fill="#0F1A2A" text-anchor="start">keel auth passkey remove "My iPhone"</text><rect x="315" y="58" width="106" height="22" rx="11" fill="#C2410C" stroke="none" stroke-width="1.5"/><text x="368" y="73" font-family="'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#F8FAFC" text-anchor="middle">that phone's</text><rect x="486" y="58" width="36" height="22" rx="11" fill="#DDE2E8" stroke="none" stroke-width="1.5"/><text x="504" y="73" font-family="'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#4B5563" text-anchor="middle">no</text><rect x="579" y="58" width="122" height="22" rx="11" fill="#B42318" stroke="none" stroke-width="1.5"/><text x="640" y="73" font-family="'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#F8FAFC" text-anchor="middle">with that passkey</text><rect x="14" y="96" width="692" height="38" rx="8"