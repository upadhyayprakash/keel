<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 166" width="720" height="166" role="img" aria-label="Lost phone: remove its passkey, end code sessions, pair again"><rect width="720" height="166" rx="14" fill="#0B1220"/><rect x="18" y="18" width="214" height="130" rx="10" fill="#111A2E" stroke="#F87171" stroke-width="1.5"/><circle cx="42" cy="42" r="10" fill="#F87171"/><text x="42" y="46" font-family="'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#0B1220" text-anchor="middle">1</text><text x="32" y="75" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="400" fill="#E2E8F0" text-anchor="start">keel auth passkey remove</text><text x="32" y="90" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="400" fill="#E2E8F0" text-anchor="start">"My iPhone"</text><text x="32" y="114.5" font-family="'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" fill="#94A3B8" text-anchor="start">The passkey stops working</text><text x="32" y="131.5" font-family="'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" fill="#94A3B8" text-anchor="start">and its sessions end</text><line x1="234" y1="83" x2="251" y2="83" stroke="#94A3B8" stroke-width="1.75"/><polygon points="251,83 241.99552897647322,78.6503446588877 241.99552897647322,87.3496553411123" fill="#94A3B8"/><rect x="253" y="18" width="214" height="130" rx="10" fill="#111A2E" stroke="#FB923C" stroke-width="1.5"/><circle cx="277" cy="42" r="10" fill="#FB923C"/><text x="277" y="46" font-family="'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#0B1220" text-anchor="middle">2</text><text x="267" y="75" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="400" fill="#E2E8F0" text-anchor="start">keel auth sessions revoke</text><text x="267" y="90" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="400" fill="#E2E8F0" text-anchor="start">--all</text><text x="267" y="114.5" font-family="'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" fill="#94A3B8" text-anchor="start">Also ends code sign-ins,</text><text x="267" y="131.5" font-family="'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" fill="#94A3B8" text-anchor="start">on every device</text><line x1="469" y1="83" x2="486" y2="83" stroke="#94A3B8" stroke-width="1.75"/><polygon points="486,83 476.9955289764732,78.6503446588877 476.9955289764732,87.3496553411123" fill="#94A3B8"/><rect x="488" y="18" width="214" height="130" rx="10" fill="#111A2E" stroke="#4ADE80" stroke-width="1.5"/><circle cx="512" cy="42" r="10" fill="#4ADE80"/><text x="512" y="46" font-family="'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#0B1220" text-anchor="middle">3</text><text x="502" y="75" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="400" fill="#E2E8F0" text-anchor="start">keel auth passkey add</text><text x="502" y="90" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="400" fill="#E2E8F0" text-anchor="start">--name "New phone"</text><text x="502" y="114.5" font-family="'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" fill="#94A3B8" text-anchor="start">Pair the new (or found)</text><text x="502" y="131.5" font-family="'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" fill="#94A3B8" text-anchor="start">phone</text></svg>
