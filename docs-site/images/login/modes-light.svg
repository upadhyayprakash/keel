<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" role="img" aria-label="Three ways to run keel serve: only this computer, through a tunnel, or on your own network"><rect width="720" height="280" rx="14" fill="#F8FAFC"/><rect x="18" y="18" width="216" height="244" rx="10" fill="#EEF2F6" stroke="#4B5563" stroke-width="1.5"/><g fill="none" stroke="#4B5563" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="32" y="36" width="32" height="24" rx="4"/><line x1="32" y1="43" x2="64" y2="43"/></g><rect x="152" y="36" width="68" height="24" rx="12" fill="#4B5563" stroke="none" stroke-width="1.5"/><text x="186" y="52" font-family="'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#F8FAFC" text-anchor="middle">login off</text><text x="34" y="92" font-family="'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#0F1A2A" text-anchor="start">Only this computer</text><rect x="32" y="104" width="188" height="50" rx="6" fill="#F8FAFC" stroke="#DDE2E8" stroke-width="1.5"/><text x="42" y="120.5" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="400" fill="#0F1A2A" text-anchor="start">keel serve</text><text x="34" y="180.5" font-family="'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" fill="#4B5563" text-anchor="start">Same as always. Open</text><text x="34" y="197.5" font-family="'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" fill="#4B5563" text-anchor="start">http://localhost:4242. No</text><text x="34" y="214.5" font-family="'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" fill="#4B5563" text-anchor="start">login.</text><rect x="249" y="18" width="216" height="244" rx="10" fill="#EEF2F6" stroke="#C2410C" stroke-width="1.5"/><g fill="none" stroke="#C2410C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M267 57 h22 a8 8 0 0 0 0 -16 a11 11 0 0 0 -21 -2 a8 8 0 0 0 -1 18 z"/></g><rect x="383" y="36" width="68" height="24" rx="12" fill="#C2410C" stroke="none" stroke-width="1.5"/><text x="417" y="52" font-family="'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#F8FAFC" text-anchor="middle">login on</text><text x="265" y="92" font-family="'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#0F1A2A" text-anchor="start">Through a tunnel</text><rect x="263" y="104" width="188" height="50" rx="6" fill="#F8FAFC" stroke="#DDE2E8" stroke-width="1.5"/><text x="273" y="120.5" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="400" fill="#0F1A2A" text-anchor="start">keel serve</text><text x="273" y="136.5" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="400" fill="#0F1A2A" text-anchor="start">--public-url https://...</text><text x="265" y="180.5" font-family="'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" fill="#4B5563" text-anchor="start">Your phone, from anywhere.</text><text x="265" y="197.5" font-family="'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" fill="#4B5563" text-anchor="start">Passkeys work. Every</text><text x="265" y="214.5" font-family="'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" fill="#4B5563" text-anchor="start">request needs a login.</text><rect x="480" y="18" width="216" height="244" rx="10" fill="#EEF2F6" stroke="#1D4ED8" stroke-width="1.5"/><g fill="none" stroke="#1D4ED8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="495" y="35" width="30" height="11" rx="3"/><rect x="495" y="50" width="30" height="11" rx="3"/><circle cx="501" cy="40.5" r="1" fill="#1D4ED8"/><circle cx="501" cy="55.5" r="1" fill="#1D4ED8"/></g><rect x="614" y="36" width="68" height="24" rx="12" fill="#1D4ED8" stroke="none" stroke-width="1.5"/><text x="648" y="52" font-family="'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#F8FAFC" text-anchor="middle">login on</text><text x="496" y="92" font-family="'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#0F1A2A" text-anchor="start">Your own network</text><rect x="494" y="104" width="188" height="50" rx="6" fill="#F8FAFC" stroke="#DDE2E8" stroke-width="1.5"/><text x="504" y="120.5" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="400" fill="#0F1A2A" text-anchor="start">keel serve --host 0.0.0.0</text><text x="504" y="136.5" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="400" fill="#0F1A2A" text-anchor="start">--cert c.pem --key k.pem</text><text x="496" y="180.5" font-family="'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" fill="#4B5563" text-anchor="start">Refuses to start until a</text><text x="496" y="197.5" font-family="'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" fill="#4B5563" text-anchor="start">login is set up. Codes</text><text x="496" y="214.5" font-family="'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" fill="#4B5563" text-anchor="start">work here, passkeys need</text><text x="496" y="231.5" font-family="'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" fill="#4B5563" text-anchor="start">the tunnel.</text></svg>
