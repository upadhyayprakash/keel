<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 654" width="720" height="654" role="img" aria-label="Signing in with a passkey"><rect width="720" height="654" rx="14" fill="#0B1220"/><line x1="120" y1="110" x2="120" y2="640" stroke="#5EEAD4" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="3 5"/><line x1="360" y1="110" x2="360" y2="640" stroke="#93C5FD" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="3 5"/><line x1="600" y1="110" x2="600" y2="640" stroke="#C4B5FD" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="3 5"/><rect x="20" y="18" width="200" height="92" rx="10" fill="#111A2E" stroke="#5EEAD4" stroke-width="1.5"/><g fill="none" stroke="#5EEAD4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="111" y="29" width="18" height="30" rx="4"/><line x1="117" y1="54" x2="123" y2="54"/></g><text x="120" y="80" font-family="'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#E2E8F0" text-anchor="middle">Your phone</text><text x="120" y="98" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="400" fill="#94A3B8" text-anchor="middle">browser</text><rect x="260" y="18" width="200" height="92" rx="10" fill="#111A2E" stroke="#93C5FD" stroke-width="1.5"/><g fill="none" stroke="#93C5FD" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="345" y="31" width="30" height="11" rx="3"/><rect x="345" y="46" width="30" height="11" rx="3"/><circle cx="351" cy="36.5" r="1" fill="#93C5FD"/><circle cx="351" cy="51.5" r="1" fill="#93C5FD"/></g><text x="360" y="80" font-family="'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#E2E8F0" text-anchor="middle">keel serve</text><text x="360" y="98" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="400" fill="#94A3B8" text-anchor="middle">on your computer</text><rect x="500" y="18" width="200" height="92" rx="10" fill="#111A2E" stroke="#C4B5FD" stroke-width="1.5"/><g fill="none" stroke="#C4B5FD" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M585 34 h10 l3 4 h17 v17 h-30 z"/></g><text x="600" y="80" font-family="'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#E2E8F0" text-anchor="middle">Login files</text><text x="600" y="98" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="400" fill="#94A3B8" text-anchor="middle">~/.keel/auth</text><rect x="176.88" y="132" width="126.24000000000001" height="18" rx="4" fill="#0B1220" stroke="none" stroke-width="1.5"/><text x="240" y="144" font-family="'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#E2E8F0" text-anchor="middle">I want to sign in</text><line x1="124" y1="156" x2="356" y2="156" stroke="#94A3B8" stroke-width="1.75"/><polygon points="356,156 346.9955289764732,151.6503446588877 346.9955289764732,160.3496553411123" fill="#94A3B8"/><circle cx="136" cy="143" r="10" fill="#FB923C"/><text x="136" y="147" font-family="'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#0B1220" text-anchor="middle">1</text><rect x="129.83999999999997" y="178" width="220.32000000000002" height="34" rx="4" fill="#0B1220" stroke="none" stroke-width="1.5"/><text x="240" y="190" font-family="'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#E2E8F0" text-anchor="middle">One-time challenge (5 minutes).</text><text x="240" y="206" font-family="'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#E2E8F0" text-anchor="middle">No username needed</text><line x1="356" y1="218" x2="124" y2="218" stroke="#94A3B8" stroke-width="1.75"/><polygon points="124,218 133.00447102352678,222.3496553411123 133.00447102352678,213.6503446588877" fill="#94A3B8"/><circle cx="344" cy="205" r="10" fill="#FB923C"/><text x="344" y="209" font-family="'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#0B1220" text-anchor="middle">2</text><rect x="9.599999999999994" y="240" width="220.8" height="70" rx="8" fill="#111A2E" stroke="#5EEAD4" stroke-width="1.5"/><text x="120" y="262" font-family="'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#E2E8F0" text-anchor="middle">Face ID unlocks the</text><text x="120" y="278" font-family="'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#E2E8F0" text-anchor="middle">passkey, which signs the</text><text x="120" y="294" font-family="'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#E2E8F0" text-anchor="middle">challenge</text><circle cx="9.599999999999994" cy="240" r="10" fill="#FB923C"/><text x="9.599999999999994" y="244" font-family="'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#0B1220" text-anchor="middle">3</text><rect x="129.83999999999997" y="326" width="220.32000000000002" height="18" rx="4" fill="#0B1220" stroke="none" stroke-width="1.5"/><text x="240" y="338" font-family="'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#E2E8F0" text-anchor="middle">Signature + which passkey it is</text><line x1="124" y1="350" x2="356" y2="350" stroke="#94A3B8" stroke-width="1.75"/><polygon points="356,350 346.9955289764732,345.6503446588877 346.9955289764732,354.3496553411123" fill="#94A3B8"/><circle cx="136" cy="337" r="10" fill="#FB923C"/><text x="136" y="341" font-family="'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#0B1220" text-anchor="middle">4</text><rect x="376.56" y="372" width="206.88000000000002" height="34" rx="4" fill="#0B1220" stroke="none" stroke-width="1.5"/><text x="480" y="384" font-family="'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#E2E8F0" text-anchor="middle">Look up that passkey's public</text><text x="480" y="400" font-family="'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#E2E8F0" text-anchor="middle">key</text><line x1="364" y1="412" x2="596" y2="412" stroke="#94A3B8" stroke-width="1.75"/><polygon points="596,412 586.9955289764732,407.6503446588877 586.9955289764732,416.3496553411123" fill="#94A3B8"/><circle cx="376" cy="399" r="10" fill="#FB923C"/><text x="376" y="403" font-family="'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#0B1220" text-anchor="middle">5</text><rect x="249.6" y="434" width="220.8" height="70" rx="8" fill="#111A2E" stroke="#93C5FD" stroke-width="1.5"/><text x="360" y="456" font-family="'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#E2E8F0" text-anchor="middle">Checks the signature, the</text><text x="360" y="472" font-family="'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#E2E8F0" text-anchor="middle">address and that Face ID</text><text x="360" y="488" font-family="'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#E2E8F0" text-anchor="middle">was used</text><circle cx="249.6" cy="434" r="10" fill="#FB923C"/><text x="249.6" y="438" font-family="'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#0B1220" text-anchor="middle">6</text><rect x="379.91999999999996" y="520" width="200.16000000000003" height="34" rx="4" fill="#0B1220" stroke="none" stroke-width="1.5"/><text x="480" y="532" font-family="'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#E2E8F0" text-anchor="middle">Save the new session (only a</text><text x="480" y="548" font-family="'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#E2E8F0" text-anchor="middle">hash of it)</text><line x1="364" y1="560" x2="596" y2="560" stroke="#94A3B8" stroke-width="1.75"/><polygon points="596,560 586.9955289764732,555.6503446588877 586.9955289764732,564.3496553411123" fill="#94A3B8"/><circle cx="376" cy="547" r="10" fill="#FB923C"/><text x="376" y="551" font-family="'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#0B1220" text-anchor="middle">7</text><rect x="143.27999999999997" y="582" width="193.44000000000003" height="34" rx="4" fill="#0B1220" stroke="none" stroke-width="1.5"/><text x="240" y="594" font-family="'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#E2E8F0" text-anchor="middle">Session cookie: terminal 12</text><text x="240" y="610" font-family="'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#E2E8F0" text-anchor="middle">hours, Goals 30 days</text><line x1="356" y1="622" x2="124" y2="622" stroke="#94A3B8" stroke-width="1.75"/><polygon points="124,622 133.00447102352678,626.3496553411123 133.00447102352678,617.6503446588877" fill="#94A3B8"/><circle cx="344" cy="609" r="10" fill="#FB923C"/><text x="344" y="613" font-family="'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#0B1220" text-anchor="middle">8</text></svg>
