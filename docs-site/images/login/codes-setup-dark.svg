<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 522" width="720" height="522" role="img" aria-label="Turning on codes"><rect width="720" height="522" rx="14" fill="#0B1220"/><line x1="120" y1="110" x2="120" y2="508" stroke="#FB923C" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="3 5"/><line x1="360" y1="110" x2="360" y2="508" stroke="#C4B5FD" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="3 5"/><line x1="600" y1="110" x2="600" y2="508" stroke="#4ADE80" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="3 5"/><rect x="20" y="18" width="200" height="92" rx="10" fill="#111A2E" stroke="#FB923C" stroke-width="1.5"/><g fill="none" stroke="#FB923C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="104" y="32" width="32" height="24" rx="4"/><path d="M111 40 l5 4 l-5 4"/><line x1="120" y1="49" x2="128" y2="49"/></g><text x="120" y="80" font-family="'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#E2E8F0" text-anchor="middle">Your terminal</text><text x="120" y="98" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="400" fill="#94A3B8" text-anchor="middle">keel auth ...</text><rect x="260" y="18" width="200" height="92" rx="10" fill="#111A2E" stroke="#C4B5FD" stroke-width="1.5"/><g fill="none" stroke="#C4B5FD" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="360" cy="44" r="13"/><path d="M360 37 v7 l5 4"/></g><text x="360" y="80" font-family="'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#E2E8F0" text-anchor="middle">Authenticator app</text><text x="360" y="98" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="400" fill="#94A3B8" text-anchor="middle">on your phone</text><rect x="500" y="18" width="200" height="92" rx="10" fill="#111A2E" stroke="#4ADE80" stroke-width="1.5"/><g fill="none" stroke="#4ADE80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="593" cy="44" r="6"/><path d="M599 44 h14 m-4 0 v5 m-5 -5 v4"/></g><text x="600" y="80" font-family="'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#E2E8F0" text-anchor="middle">Keychain</text><text x="600" y="98" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="400" fill="#94A3B8" text-anchor="middle">secret store</text><rect x="9.599999999999994" y="132" width="220.8" height="54" rx="8" fill="#111A2E" stroke="#1E293B" stroke-width="1.5"/><text x="120" y="154" font-family="'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#E2E8F0" text-anchor="middle">keel auth totp enable makes</text><text x="120" y="170" font-family="'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#E2E8F0" text-anchor="middle">a new secret key</text><circle cx="9.599999999999994" cy="132" r="10" fill="#FB923C"/><text x="9.599999999999994" y="136" font-family="'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#0B1220" text-anchor="middle">1</text><rect x="136.56" y="202" width="206.88000000000002" height="34" rx="4" fill="#0B1220" stroke="none" stroke-width="1.5"/><text x="240" y="214" font-family="'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#E2E8F0" text-anchor="middle">You scan the QR code (or type</text><text x="240" y="230" font-family="'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#E2E8F0" text-anchor="middle">the key)</text><line x1="124" y1="242" x2="356" y2="242" stroke="#94A3B8" stroke-width="1.75" stroke-dasharray="6 5"/><polygon points="356,242 346.9955289764732,237.6503446588877 346.9955289764732,246.3496553411123" fill="#94A3B8"/><circle cx="136" cy="229" r="10" fill="#FB923C"/><text x="136" y="233" font-family="'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#0B1220" text-anchor="middle">2</text><rect x="249.6" y="264" width="220.8" height="54" rx="8" fill="#111A2E" stroke="#C4B5FD" stroke-width="1.5"/><text x="360" y="286" font-family="'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#E2E8F0" text-anchor="middle">Shows a new 6-digit code</text><text x="360" y="302" font-family="'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#E2E8F0" text-anchor="middle">every 30 seconds</text><circle cx="249.6" cy="264" r="10" fill="#FB923C"/><text x="249.6" y="268" font-family="'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#0B1220" text-anchor="middle">3</text><rect x="146.64" y="334" width="186.72000000000003" height="18" rx="4" fill="#0B1220" stroke="none" stroke-width="1.5"/><text x="240" y="346" font-family="'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#E2E8F0" text-anchor="middle">You type the code it shows</text><line x1="356" y1="358" x2="124" y2="358" stroke="#94A3B8" stroke-width="1.75" stroke-dasharray="6 5"/><polygon points="124,358 133.00447102352678,362.3496553411123 133.00447102352678,353.6503446588877" fill="#94A3B8"/><circle cx="344" cy="345" r="10" fill="#FB923C"/><text x="344" y="349" font-family="'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#0B1220" text-anchor="middle">4</text><rect x="9.599999999999994" y="380" width="220.8" height="70" rx="8" fill="#111A2E" stroke="#1E293B" stroke-width="1.5"/><text x="120" y="402" font-family="'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#E2E8F0" text-anchor="middle">Checks the code, so you</text><text x="120" y="418" font-family="'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#E2E8F0" text-anchor="middle">know the app is set up</text><text x="120" y="434" font-family="'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#E2E8F0" text-anchor="middle">right</text><circle cx="9.599999999999994" cy="380" r="10" fill="#FB923C"/><text x="9.599999999999994" y="384" font-family="'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#0B1220" text-anchor="middle">5</text><rect x="263.28" y="466" width="193.44000000000003" height="18" rx="4" fill="#0B1220" stroke="none" stroke-width="1.5"/><text x="360" y="478" font-family="'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#E2E8F0" text-anchor="middle">Saves the key. Codes are on</text><line x1="124" y1="490" x2="596" y2="490" stroke="#94A3B8" stroke-width="1.75"/><polygon points="596,490 586.9955289764732,485.6503446588877 586.9955289764732,494.3496553411123" fill="#94A3B8"/><circle cx="136" cy="477" r="10" fill="#FB923C"/><text x="136" y="481" font-family="'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#0B1220" text-anchor="middle">6</text></svg>
