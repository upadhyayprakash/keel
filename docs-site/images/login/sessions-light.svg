<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" width="720" height="290" role="img" aria-label="How long sessions last"><rect width="720" height="290" rx="14" fill="#F8FAFC"/><text x="20" y="50" font-family="'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#0F1A2A" text-anchor="start">Browser terminal</text><text x="20" y="67" font-family="'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="#4B5563" text-anchor="start">passkey</text><rect x="210" y="38" width="150" height="26" rx="6" fill="#C2410C" stroke="none" stroke-width="1.5"/><text x="350" y="56" font-family="'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" font-weight="700" fill="#F8FAFC" text-anchor="end">12 hours</text><text x="20" y="112" font-family="'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#0F1A2A" text-anchor="start">Any code sign-in</text><text x="20" y="129" font-family="'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="#4B5563" text-anchor="start">terminal or Goals</text><rect x="210" y="100" width="150" height="26" rx="6" fill="#6D28D9" stroke="none" stroke-width="1.5"/><text x="350" y="118" font-family="'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" font-weight="700" fill="#F8FAFC" text-anchor="end">12 hours</text><text x="20" y="174" font-family="'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#0F1A2A" text-anchor="start">Goals</text><text x="20" y="191" font-family="'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="#4B5563" text-anchor="start">passkey</text><rect x="210" y="162" width="470" height="26" rx="6" fill="#0E7490" stroke="none" stroke-width="1.5"/><text x="670" y="180" font-family="'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" font-weight="700" fill="#F8FAFC" text-anchor="end">30 days, renewed while you use it</text><line x1="210" y1="220" x2="680" y2="220" stroke="#DDE2E8" stroke-width="2"/><line x1="210" y1="216" x2="210" y2="224" stroke="#4B5563" stroke-width="2"/><text x="210" y="240" font-family="'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="#4B5563" text-anchor="start">sign in</text><line x1="360" y1="216" x2="360" y2="224" stroke="#4B5563" stroke-width="2"/><text x="360" y="240" font-family="'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="#4B5563" text-anchor="middle">12 h</text><line x1="430.50847457627117" y1="216" x2="430.50847457627117" y2="224" stroke="#4B5563" stroke-width="2"/><text x="430.50847457627117" y="240" font-family="'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="#4B5563" text-anchor="middle">1 week</text><line x1="680" y1="216" x2="680" y2="224" stroke="#4B5563" stroke-width="2"/><text x="680" y="240" font-family="'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="#4B5563" text-anchor="end">30 days</text><text x="20" y="270" font-family="'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">After that, the next command shows the sign-in screen. Nothing is lost: only the login ends.</text></svg>
