ily="'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#E2E8F0" text-anchor="middle">private key never leaves</text><text x="600" y="560" font-family="'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#E2E8F0" text-anchor="middle">the phone</text><circle cx="489.6" cy="474" r="10" fill="#FB923C"/><text x="489.6" y="478" font-family="'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#0B1220" text-anchor="middle">6</text><rect x="396.72" y="592" width="166.56" height="34" rx="4" fill="#0B1220" stroke="none" stroke-width="1.5"/><text x="480" y="604" font-family="'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#E2E8F0" text-anchor="middle">Public key + the signed</text><text x="480" y="620" font-family="'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#E2E8F0" text-anchor="middle">challenge</text><line x1="596" y1="632" x2="364" y2="632" stroke="#94A3B8" stroke-width="1.75"/><polygon points="364,632 373.0044710235268,636.3496553411123 373.0044710235268,627.6503446588877" fill="#94A3B8"/><circle cx="584" cy="619" r="10" fill="#FB923C"/><text x="584" y="623" font-family="'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#0B1220" text-anchor="middle">7</text><rect x="249.6" y="654" width="220.8" height="86" rx="8" fill="#111A2E" stroke="#93C5FD" stroke-width="1.5"/><text x="360" y="676" font-family="'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#E2E8F0" text-anchor="middle">Checks the link, challenge,</text><text x="360" y="692" font-family="'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#E2E8F0" text-anchor="middle">addres